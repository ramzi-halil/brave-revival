    float max_cool_time = 7;
    float initial_min_cool_time = 8;
    float initial_max_cool_time = 9;
    uint32 meta_tag_id_1 = 10 [(options.fk) = "master/active_skill_meta_tag"];
    uint32 meta_tag_id_2 = 11 [(options.fk) = "master/active_skill_meta_tag"];
