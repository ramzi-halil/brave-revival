    uint32 priority = 3;
    uint32 type = 4;
    uint32 type_value = 5;
    uint32 target_equipment_job_id = 6 [(options.fk) = "master/job"];
    uint32 target_equipment_category = 7;
    uint32 target_equipment_part = 8;
    uint32 category = 9;
    string category_value = 10;
    uint32 passive_skill_id_1 = 11 [(options.fk) = "master/passive_skill"];
    uint32 passive_skill_id_2 = 12 [(options.fk) = "master/passive_skill"];
    uint32 passive_skill_id_3 = 13 [(options.fk) = "master/passive_skill"];
    uint32 stamp_point = 14;
    string open_date = 15 [(options.datetime) = true];
}

