message Achievement {
    uint32 id = 1;
    uint32 condition_category_id = 2 [(options.fk) = "master/condition_category"];
    uint32 text_name = 3 [(options.fk) = "master/text_lang"];
    uint32 achievement_category_id = 4 [(options.fk) = "master/achievement_category"];
    uint32 achievement_point = 5;
    uint32 preview_achievement_id = 6 [(options.fk) = "master/achievement"];
    uint32 type_value = 7;
    uint32 display_priority = 8;
    uint32 reward_group_id = 9 [(options.fk) = "master/reward_group"];
    string open_date = 10 [(options.datetime) = true];
}

message AchievementCategory {
    uint32 id = 1;
    uint32 text_name = 2 [(options.fk) = "master/text_lang"];
    uint32 resource_id = 3 [(options.fk) = "resources"];
}

message AchievementEquipment {
    uint32 id = 1;
