    StoredData stored_data = 1;
    uint32 gacha_id = 2;
    repeated RewardInfo inventory = 3;
    repeated RewardInfo present = 4;
    repeated RewardInfo bonus = 5;
    map<uint32, bool> new_equipment = 6;
}

message ShopItemReceiveList {
    Pcommon.Error error = 1;
    StoredData stored_data = 2;
    bool is_free = 3;
    repeated RewardInfo inventory_receive_list = 4;
    repeated RewardInfo present_receive_list = 5;
    repeated RewardInfo bonus_receive_list = 6;
    repeated RewardInfo first_receive_list = 7;
