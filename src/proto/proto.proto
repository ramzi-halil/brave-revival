syntax = "proto3";
package Proto;

import "pcommon.proto";
import "pmaster.proto";
import "puser.proto";
import "pmisc.proto";
import "options.proto";

option go_package = "example.com/brave-revival/src/proto/proto";

message Empty {
    Pcommon.Error error = 1;
}

message PlayerSummary {
    uint64 player_id = 1;
    string nickname = 2;
    string comment = 3;
    uint32 job_id = 4;
    uint32 job_level = 5;
    uint32 power = 6;
    uint64 guild_id = 7;
    uint32 guild_member_type = 8;
    uint32 favorite_equipment = 9;
    string login_at = 10 [(options.datetime) = true];
    uint32 max_job_level = 11;
}

message PlayerExist {
    Pcommon.Error error = 1;
    PlayerSummary player_summary = 2;
    string world_description = 3;
}

message AccountAuthorize {
    string token = 1;
    uint32 ban_type = 2;
    uint64 ban_interval = 3;
}

message AccountCertificate {
    Pmaster.Version version = 1;
}

message BaseParameter {
    uint32 hp = 1;
    uint32 mp = 2;
    uint32 phy_atk = 3;
    uint32 mag_atk = 4;
    uint32 heal = 5;
    uint32 phy_def = 6;
    uint32 mag_def = 7;
    uint32 accuracy = 8;
    uint32 dodge = 9;
    uint32 critical = 10;
    uint32 agility = 11;
}

message BattleClearParam {
    uint32 power = 1;
    uint32 job_level = 2;
    uint64 job_level_exp = 3;
    uint64 job_level_exp_max = 4;
    uint64 job_total_exp = 5;
    uint64 job_total_exp_max = 6;
    uint32 job_point = 7;
    BaseParameter job_parameter = 8;
    uint32 arena_ranking = 9;
    uint32 arena_rank = 10;
    uint32 arena_rank_point = 11;
    uint32 arena_rank_point_max = 12;
    uint32 arena_total_point = 13;
    uint32 arena_total_point_max = 14;
    BaseParameter arena_parameter = 15;
    uint32 crystal_level = 16;
    uint32 crystal_skill_point = 17;
    uint32 risk = 18;
    uint32 fastest_clear_time = 19;
    uint32 job_id = 20;
}

message RewardInfo {
    uint32 target_type = 1;
    uint32 target_id = 2;
    uint32 quantity = 3;
    uint32 equipment_rarity = 4;
    uint32 equipment_level = 5;
    uint32 enhancement = 6;
    uint32 limit_break = 7;
    uint32 is_protected = 8;
    uint32 equipment_param_option1 = 9;
    uint32 equipment_param_option2 = 10;
    uint32 equipment_param_option3 = 11;
}

message BattleBackgroundReward {
    uint64 lupi = 1;
    repeated RewardInfo reward_list = 2;
    uint32 win = 3;
    uint32 total = 4;
    BattleClearParam before = 5;
    BattleClearParam after = 6;
}

message BackgroundStatus {
    bool on_progress = 1;
    uint64 start_ts = 2;
    uint32 loop_cnt = 3;
    BattleBackgroundReward reward = 4;
}

message GuildSummary {
    uint64 guild_id = 1;
    string name = 2;
    uint32 symbol = 3;
    uint32 symbol_frame = 4;
    uint32 symbol_frame_color = 5;
    uint32 member_count = 6;
    uint32 member_max_count = 7;
    uint32 lv = 8;
    uint64 power = 9;
    uint32 ranking_rank = 10;
    uint32 ranking_score = 11;
}

message GuildMember {
    uint64 guild_id = 1;
    uint64 player_id = 2;
    uint32 role = 3;
    uint64 point = 4;
    uint64 weekly_point = 5;
    string last_joined_at = 6 [(options.datetime) = true];
    string login_reward_received_at = 7 [(options.datetime) = true];
    string updated_point_at = 8 [(options.datetime) = true];
    string training_completed_at = 9 [(options.datetime) = true];
}

message PowerAssessment {
    uint32 power_assessment_type = 1;
    uint32 step = 2;
}

message PlayerDetail {
    Puser.Player player = 1;
    uint32 is_friend = 2;
    uint32 is_friend_request = 3;
    uint32 is_friend_approval = 4;
    Puser.Job current_job = 5;
    repeated Puser.Job jobs = 6;
    Puser.JobDeck current_job_deck = 7;
    repeated Puser.Equipment equipments = 8;
    repeated Puser.Elixir elixirs = 9;
    uint64 max_damage = 10;
    uint64 weekly_guild_point = 11;
    uint64 total_guild_point = 12;
    uint64 total_yell = 13;
    uint64 total_win = 14;
    uint64 max_win_streak = 15;
    BaseParameter base_parameter = 16;
    uint32 floor_number = 17;
    uint32 power = 18;
    uint32 can_block = 19;
    uint32 can_guild_invite = 20;
    uint32 anima_user_achieve = 21;
    uint32 arena_ranking = 22;
    uint32 arena_total_point = 23;
    bool is_blocked = 24;
    GuildSummary guild_summary = 25;
    GuildMember guild_member = 26;
    repeated PowerAssessment power_assessment_list = 27;
    uint32 power_assessment_rank = 28;
}

message PlayerList {
    repeated Puser.Player players = 1;
    uint32 highest_job_lv = 2;
    Pcommon.Error error = 3;
    BackgroundStatus background_status = 4;
}

message Host {
    string photon = 1;
    string chat = 2;
    string party = 3;
    string notify = 4;
    string gvg = 5;
    string realtime = 6;
    int32 gvg_hosts = 7;
}

message Revision {
    int32 terms = 1;
    int32 privacy_policy = 2;
}

message Etc {
    Host host = 1;
    string language = 2;
    string environment = 3;
    float gmt = 4;
    string store_review_url = 5;
    Revision revision = 6;
}

message GuildFacilityList {
}

message GuildPersonalMissionResult {
    Pmisc.GuildPersonalMissionList list = 1;
}

message GuildSharedMissionResult {
    Pmisc.GuildSharedMissionList list = 1;
    Pmisc.GuildSharedMissionRankingList ranking = 2;
    Pmisc.Guild guild = 3;
}

message AgitoVisitorReturn {
}

message FieldPlayerDetail {
    Puser.Player player = 1;
    Puser.JobDeck current_job_deck = 2;
    repeated Puser.Equipment equipments = 3;
    uint64 guild_id = 4;
    string guild_name = 5;
    uint32 guild_symbol = 6;
    uint32 guild_symbol_frame = 7;
    uint32 guild_symbol_frame_color = 8;
    uint32 guild_member_role = 9;
}

message FieldTopResponse {
    StoredData stored_data = 1;
    repeated FieldPlayerDetail players = 2;
    uint64 guild_id = 3;
    string guild_name = 4;
    uint32 guild_symbol = 5;
    uint32 guild_symbol_frame = 6;
    uint32 guild_symbol_frame_color = 7;
    uint32 guild_member_role = 8;
    bool is_present_box = 9;
    uint32 friend_badge = 10;
    uint32 guild_badge = 11;
    // repeated GuildWeeklyMission weeklyMissionList = 12;
    Pmisc.GuildSharedMissionList sharedMissionList = 13;
    Pmisc.GuildPersonalMissionList personalMissionList = 14;
    // repeated RaidHistory raid_history_list = 15;
    Puser.GuildWeeklyMissionRewardList weekly_mission_reward = 16;
    GuildFacilityList facility_list = 17;
    BattleBackgroundReward background_battle_reward = 18;
    repeated Puser.LoginBonus login_bonus = 19;
    AgitoVisitorReturn agito_visitor_return = 20;
    string last_agito_received_good_at = 21;
    uint32 present_box_count = 22;
    uint32 direct_message_badge = 24;
    uint32 direct_message_count = 25;
    // ArenaSeasonResponse arena_season = 26;
}

message Currency {
    uint32 red_orb = 1;
    uint32 free_blue_orb = 2;
    uint32 paid_blue_orb = 3;
    uint32 total_orb = 4;
}

message GuildInfo {
    uint64 guild_id = 1;
